# Free Supabase projects pause after about a week without activity, which
# would take the app offline. This makes one small read a day so the
# database always has recent activity.
#
# GitHub turns off scheduled workflows in repos with no commits for 60 days;
# if that happens, re-enable it from the Actions tab (or push anything).
name: keep awake

on:
  schedule:
    - cron: '17 15 * * *' # daily, 8:17 am Pacific (daylight time)
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    name: ping the database
    runs-on: ubuntu-latest
    env:
      # Public values the app already ships with (see pages.yml).
      SUPABASE_URL: https://rzijjjaazapmwbzhsukx.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_iw22x2-Lu0f6UGIGDSx6Mg_HdXKks2t
    steps:
      - name: Read one approved organization
        run: |
          status=$(curl --silent --output response.json --write-out '%{http_code}' \
            --header "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            "$SUPABASE_URL/rest/v1/organizations?select=id&status=eq.approved&limit=1")
          echo "status $status"
          cat response.json
          # Fail loudly (GitHub emails the repo owner) if the database didn't answer.
          test "$status" = 200
